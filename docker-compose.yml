services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_platform
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: 123123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3
    container_name: booking-localstack
    environment:
      SERVICES: sqs,s3
      DEFAULT_REGION: ap-southeast-1
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
    container_name: booking-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_platform
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: 123123
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits-long!!
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  venue-service:
    build:
      context: ./services/venue-service
    container_name: booking-venue-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_platform
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: 123123
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits-long!!
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: ./services/booking-service
    container_name: booking-booking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_platform
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: 123123
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits-long!!
      VENUE_SERVICE_BASE_URL: http://venue-service:8082
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      venue-service:
        condition: service_started
      localstack:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
    container_name: booking-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_platform
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: 123123
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits-long!!
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
    container_name: booking-notification-service
    environment:
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-booking-platform@example.com}
      MAIL_FALLBACK_TO: ${MAIL_FALLBACK_TO:-notifications@example.com}
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8085:8085"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  realtime-service:
    build:
      context: ./services/realtime-service
    container_name: booking-realtime-service
    environment:
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits-long!!
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8086:8086"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  gateway-service:
    build:
      context: ./services/gateway-service
    container_name: booking-gateway-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      VENUE_SERVICE_URL: http://venue-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      REALTIME_SERVICE_URL: http://realtime-service:8086
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - venue-service
      - booking-service
      - payment-service
      - realtime-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  localstack_data:
