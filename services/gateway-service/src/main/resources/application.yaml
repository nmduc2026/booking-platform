server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-admin
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/admin/**
              filters:
                - StripPrefix=2
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: venue-admin
              uri: ${VENUE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/venue/admin/**
              filters:
                - StripPrefix=2
            - id: venue
              uri: ${VENUE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/venue/**
              filters:
                - StripPrefix=2
            - id: booking
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/booking/**
              filters:
                - StripPrefix=2
            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=2
            - id: realtime
              uri: ${REALTIME_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/realtime/**
              filters:
                - StripPrefix=1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
