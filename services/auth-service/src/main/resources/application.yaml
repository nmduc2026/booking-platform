server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_platform
    username: booking
    password: 123123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth_schema
  flyway:
    enabled: true
    schemas: auth_schema
    default-schema: auth_schema
    create-schemas: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits-long!!}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
  seed:
    enabled: true
    admin-email: admin@booking.local
    admin-password: Admin@123456
    admin-full-name: System Admin
    manager-email: manager@booking.local
    manager-password: Manager@123456
    manager-full-name: Demo Manager
    user-email: user@booking.local
    user-password: User@123456
    user-full-name: Demo Customer
